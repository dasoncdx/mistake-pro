<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>错题Pro - 登录</title>
<style>
:root {
  --blue: #5B7FFF; --blue-bg: rgba(91,127,255,.08);
  --red: #FF5B6B; --red-bg: rgba(255,91,107,.07);
  --text: #1A1C24; --text-sub: #5E6372; --text-weak: #949AAD;
  --bg: #F5F6FA; --white: #FFFFFF; --card: #EEF0F5; --border: #E4E6EC;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:420px; text-align:center; padding:60px 24px 32px; }
.header .logo { font-size:28px; font-weight:700; color:var(--text); }
.header .logo span { color:var(--blue); }
.header .sub { font-size:13px; color:var(--text-sub); margin-top:4px; }
.container { width:100%; max-width:420px; padding:0 24px; }
.card { background:var(--white); border-radius:18px; padding:20px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.03); }
.btn { display:block; width:100%; height:50px; border:none; border-radius:13px; font-size:15px; font-weight:600; cursor:pointer; text-align:center; }
.btn-pri { background:var(--blue); color:#FFF; }
.btn-sec { background:var(--card); color:var(--text); margin-top:8px; }
.inp { width:100%; height:46px; background:var(--card); border:none; border-radius:11px; padding:0 14px; font-size:14px; color:var(--text); outline:none; margin-bottom:10px; }
.inp:focus { background:var(--white); box-shadow:0 0 0 3px rgba(91,127,255,.12); }
.inp::placeholder { color:var(--text-weak); }
.c-blue { color:var(--blue); }
.c-red { color:var(--red); }
.error { background:var(--red-bg); color:var(--red); padding:12px 16px; border-radius:12px; font-size:13px; margin-bottom:12px; }
.user-list { margin-bottom:16px; }
.user-item { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--white); border-radius:14px; margin-bottom:8px; cursor:pointer; transition:all .15s; box-shadow:0 1px 2px rgba(0,0,0,.03); }
.user-item:hover { background:var(--blue-bg); }
.user-item .name { font-size:15px; font-weight:600; color:var(--text); }
.user-item .grade { font-size:12px; color:var(--text-sub); }
.footer { text-align:center; padding:20px; }
.footer a { color:var(--blue); font-size:14px; text-decoration:none; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">错题<span>Pro</span></div>
  <div class="sub">让每一道错题，变成知识版图上被征服的领地</div>
</div>
<div class="container">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if users %}
  <div class="user-list">
    <div style="font-size:13px;color:var(--text-sub);margin-bottom:8px;font-weight:600;">选择账号</div>
    {% for u in users %}
    <form method="post" action="/login">
      <input type="hidden" name="name" value="{{ u.name }}">
      <div class="user-item" onclick="this.parentElement.querySelector('input[type=password]').focus()" style="position:relative;">
        <div><div class="name">{{ u.name }}</div><div class="grade" style="margin-top:2px;">{{ u.grade }}</div></div>
        <input type="password" name="password" placeholder="密码" class="inp" style="width:120px;margin:0;" required>
      </div>
    </form>
    {% endfor %}
  </div>
  {% else %}
  <div style="text-align:center;color:var(--text-sub);font-size:14px;padding:40px 0;">还没有账号</div>
  {% endif %}
</div>
<div class="footer"><a href="/register">＋ 创建新账号</a></div>
</body>
</html>
