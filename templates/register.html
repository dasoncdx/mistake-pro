<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>错题Pro - 注册</title>
<style>
:root {
  --blue: #5B7FFF; --blue-bg: rgba(91,127,255,.08);
  --red: #FF5B6B; --red-bg: rgba(255,91,107,.07);
  --text: #1A1C24; --text-sub: #5E6372; --text-weak: #949AAD;
  --bg: #F5F6FA; --white: #FFFFFF; --card: #EEF0F5; --border: #E4E6EC;
  --green: #34C759;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:420px; text-align:center; padding:32px 24px 20px; }
.header h1 { font-size:22px; font-weight:700; color:var(--text); }
.container { width:100%; max-width:420px; padding:0 24px; }
.btn { display:block; width:100%; height:50px; border:none; border-radius:13px; font-size:15px; font-weight:600; cursor:pointer; text-align:center; color:#FFF; }
.btn-pri { background:var(--blue); margin-top:20px; }
.inp { width:100%; height:46px; background:var(--card); border:none; border-radius:11px; padding:0 14px; font-size:14px; color:var(--text); outline:none; margin-bottom:8px; font-family:inherit; }
.inp:focus { background:var(--white); box-shadow:0 0 0 3px rgba(91,127,255,.12); }
.inp::placeholder { color:var(--text-weak); }
.sel { width:100%; height:46px; background:var(--card); border:none; border-radius:11px; padding:0 12px; font-size:14px; color:var(--text); outline:none; margin-bottom:8px; font-family:inherit; appearance:none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23949AAD' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 12px center; }
.label { font-size:11px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:1.5px; margin:14px 0 6px; }
.error { background:var(--red-bg); color:var(--red); padding:12px 16px; border-radius:12px; font-size:13px; margin-bottom:12px; }
.back { color:var(--blue); font-size:14px; text-decoration:none; display:block; padding:16px; text-align:center; }
.chk-row { display:flex; gap:8px; flex-wrap:wrap; }
.chk { padding:8px 14px; background:var(--card); border-radius:8px; font-size:13px; color:var(--text); cursor:pointer; border:2px solid transparent; }
.chk input { display:none; }
.chk:has(input:checked) { background:var(--blue-bg); border-color:var(--blue); color:#3D5FD9; font-weight:600; }
</style>
</head>
<body>
<div class="header"><h1>创建账号</h1></div>
<div class="container">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <div class="label">昵称</div>
    <input class="inp" name="name" placeholder="输入昵称（非真实姓名）" required>
    <div class="label">密码</div>
    <input class="inp" name="password" type="password" placeholder="至少3位" required minlength="3">
    <input class="inp" name="password2" type="password" placeholder="确认密码" required>
    <div class="label">所在地区</div>
    <input class="inp" name="province" placeholder="省" value="广东">
    <input class="inp" name="city" placeholder="市" value="广州">
    <input class="inp" name="district" placeholder="区" value="天河">
    <div class="label">在读年级</div>
    <select class="sel" name="grade">
      <option value="grade_1">小一</option><option value="grade_2">小二</option><option value="grade_3">小三</option><option value="grade_4" selected>小四</option><option value="grade_5">小五</option><option value="grade_6">小六</option>
      <option value="grade_7">初一</option><option value="grade_8">初二</option><option value="grade_9">初三</option><option value="grade_10">高一</option><option value="grade_11">高二</option><option value="grade_12">高三</option>
    </select>
    <div class="label">教材版本</div>
    <select class="sel" name="curriculum">
      <option>人教版</option><option>北师大版</option><option>苏教版</option><option>沪教版</option><option>其他</option>
    </select>
    <div class="label">科目</div>
    <div class="chk-row">
      <label class="chk"><input type="checkbox" name="subjects" value="math" checked> 数学</label>
      <label class="chk"><input type="checkbox" name="subjects" value="english"> 英语</label>
      <label class="chk"><input type="checkbox" name="subjects" value="chinese"> 语文</label>
    </div>
    <button class="btn btn-pri">确认，开始使用</button>
  </form>
  <a href="/login" class="back">← 返回登录</a>
</div>
</body>
</html>
